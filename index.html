<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huntrix: Румигийн Үгийн Ангуучид</title>
    <link rel="stylesheet" href="style.css">
    <!-- Хөдөлгөөнт анимейшн зориулсан сан -->
    <link rel="stylesheet" href="https://cloudflare.com"/>
</head>
<body>

    <h1 class="animate__animated animate__fadeInDown">HUNTR/X: RUMI STAGE</h1>
    <div class="subtitle">🎤 ХАГАС ЧӨТГӨР РУМИГИЙН ХАМТ ҮГНҮҮДИЙГ АНГУУДАЦГААЯ! ⚔️</div>

    <!-- Өдрийн сонголт -->
    <div class="tabs" id="tabs-container"></div>

    <!-- Тоглоомын статус -->
    <div class="dashboard animate__animated animate__fadeIn">
        <div class="stat">Ангуучны HP: <span id="lives-display">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</span></div>
        <div class="stat">Хугацаа: <span id="timer">60</span>с</div>
        <div class="stat">Оноо: <span id="score">0</span></div>
    </div>

    <!-- Тоглоомын төв талбар -->
    <div class="game-container">
        <!-- Эхлэх / Дуусах дэлгэц -->
        <div class="overlay" id="start-overlay">
            <h3 style="margin-bottom: 10px; color: var(--rumi-cyan); font-size: 1.8rem;">Румигийн тайзанд тавтай морил!</h3>
            <p style="color: #ddd; margin-bottom: 25px; max-width: 85%; font-size: 1rem;">Үгийг уншаад зөв зургийг дар. Буруу дарвал 1 амь хасагдана!</p>
            <button class="start-btn animate__animated animate__pulse animate__infinite" onclick="startGame()">Тоглоомыг Эхлүүлэх</button>
        </div>
        
        <div class="overlay hidden" id="end-overlay">
            <h2 id="end-title" style="font-size: 2.2rem;">Ангуу Дууслаа!</h2>
            <p style="font-size: 1.4rem; margin: 15px 0;">Нийт оноо: <span id="final-score" style="color: var(--rumi-cyan); font-weight: bold;">0</span></p>
            <button class="start-btn" onclick="resetGame()">Дахин тоглох</button>
        </div>

        <!-- Унших үг харуулах карт -->
        <div class="word-card" id="word-card">
            <div class="word-display" id="word-box">Алим</div>
        </div>

        <!-- 4 Сонгох зураг -->
        <div class="options-grid" id="options-grid"></div>
    </div>

    <script src="words.js"></script>
    <script src="script.js"></script>
</body>
</html>
