<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-pop Demon Hunters: Үгийн Ангуучид</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>K-pop Demon Hunters</h1>
    <div class="subtitle">⚔️ КОРЕЙ ХИТ АЯЗТАЙ ҮГНИЙ АНГУУЧИД ⚔️</div>

    <!-- Өдрийн Сонголт -->
    <div class="tabs" id="tabs-container"></div>

    <!-- Оноо болон Хугацаа -->
    <div class="dashboard">
        <div class="stat">Хугацаа: <span id="timer">60</span>с</div>
        <div class="stat">Оноо: <span id="score">0</span></div>
    </div>

    <!-- Флаш Карт -->
    <div class="card-container">
        <div class="overlay" id="start-overlay">
            <h3 style="margin-bottom: 20px; color: var(--neon-blue);">Ангуучин бэлэн үү?</h3>
            <button class="start-btn" onclick="startGame()">Ангууг Эхлүүлэх</button>
        </div>
        <div class="overlay hidden" id="end-overlay">
            <h2 style="color: var(--neon-pink);">Ангуу Дууслаа!</h2>
            <p style="font-size: 1.2rem;">Чиний цуглуулсан оноо: <span id="final-score" style="color: var(--neon-blue); font-weight: bold;">0</span></p>
            <button class="start-btn" onclick="resetGame()" style="background: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue);">Дахин тоглох</button>
        </div>
        <div class="word-display" id="word-box">-</div>
    </div>

    <!-- Товчлуурууд -->
    <div class="controls">
        <button class="btn btn-wrong" id="btn-wrong" onclick="nextWord(false)" disabled>Алгасах ❌</button>
        <button class="btn btn-correct" id="btn-correct" onclick="nextWord(true)" disabled>Уншсан ⚔️</button>
    </div>

    <!-- Скриптүүдийг холбох -->
    <script src="words.js"></script>
    <script src="script.js"></script>
</body>
</html>
